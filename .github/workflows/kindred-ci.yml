name: Validate Kindred source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kindred-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test operator installation, upgrades and recovery
        run: sudo python3 -B -m unittest discover -s kindred-dominion/deployment/operator -p 'test_*.py' -v
      - name: Build candidates and run isolated read-only validation
        run: python3 -B kindred-dominion/deployment/operator/ci_validate.py
